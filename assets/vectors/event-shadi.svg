<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shadiChampagne" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F5E8D0" />
      <stop offset="75%" stop-color="#C5A869" />
      <stop offset="100%" stop-color="#9B7ED9" />
    </linearGradient>
    <linearGradient id="sacredFire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7C2D12" />
      <stop offset="30%" stop-color="#C2410C" />
      <stop offset="65%" stop-color="#F97316" />
      <stop offset="90%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <radialGradient id="shadiAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F3E8FF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#E9D5FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#9B7ED9" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Aura Halo -->
  <circle cx="100" cy="100" r="90" fill="url(#shadiAura)" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#shadiChampagne)" stroke-width="1.5" stroke-dasharray="3,4" />

  <!-- Sacred Vedic Agni Kund (Altar for 7 Pheras) -->
  <!-- Altar Tier 1 (Base Platform in Champagne) -->
  <polygon points="40,172 160,172 148,156 52,156" fill="url(#shadiChampagne)" />
  <!-- Altar Tier 2 (Middle Tier in Royal Violet) -->
  <polygon points="52,156 148,156 138,143 62,143" fill="#6B21A8" />
  <!-- Altar Tier 3 (Inner Sacred Pit) -->
  <polygon points="62,143 138,143 130,133 70,133" fill="#3B0764" />

  <!-- Sacred Agni (Holy Fire for Pheras) -->
  <g>
    <!-- Center Main Dancing Flame -->
    <path d="M 100 68 C 85 93, 80 114, 85 131 C 95 134, 105 134, 115 131 C 120 114, 115 93, 100 68 Z" fill="url(#sacredFire)" />
    <!-- Left Dancing Flame -->
    <path d="M 90 84 C 80 99, 75 117, 82 131 C 90 133, 98 131, 95 121 C 90 106, 96 94, 90 84 Z" fill="#F97316" />
    <!-- Right Dancing Flame -->
    <path d="M 110 84 C 120 99, 125 117, 118 131 C 110 133, 102 131, 105 121 C 110 106, 104 94, 110 84 Z" fill="#FDE047" />
    <!-- Inner Radiant Core White Flame -->
    <path d="M 100 96 C 95 106, 95 121, 100 129 C 105 121, 105 106, 100 96 Z" fill="#FFFFFF" />
  </g>

  <!-- Crossed Ceremonial Shehnai with Bells & Tassels at Top -->
  <g transform="translate(100, 48)">
    <!-- Shehnai 1 -->
    <g transform="rotate(25)">
      <polygon points="-5,-30 5,-30 2,25 -2,25" fill="url(#shadiChampagne)" />
      <path d="M -9,-30 C -9,-38, 9,-38, 9,-30 Z" fill="url(#shadiChampagne)" />
      <circle cx="0" cy="-10" r="1.3" fill="#3B0764" />
      <circle cx="0" cy="-2" r="1.3" fill="#3B0764" />
      <circle cx="0" cy="6" r="1.3" fill="#3B0764" />
      <circle cx="0" cy="14" r="1.3" fill="#3B0764" />
    </g>
    <!-- Shehnai 2 -->
    <g transform="rotate(-25)">
      <polygon points="-5,-30 5,-30 2,25 -2,25" fill="url(#shadiChampagne)" />
      <path d="M -9,-30 C -9,-38, 9,-38, 9,-30 Z" fill="url(#shadiChampagne)" />
      <circle cx="0" cy="-10" r="1.3" fill="#3B0764" />
      <circle cx="0" cy="-2" r="1.3" fill="#3B0764" />
      <circle cx="0" cy="6" r="1.3" fill="#3B0764" />
      <circle cx="0" cy="14" r="1.3" fill="#3B0764" />
    </g>
  </g>

  <!-- Sacred Varmala (Garland) Pearls Arc -->
  <path d="M 35 120 Q 100 185 165 120" stroke="#E2E8F0" stroke-width="1.8" stroke-dasharray="3,5" fill="none" />
  <circle cx="100" cy="152" r="3.5" fill="#C5A869" />
  <circle cx="70" cy="140" r="2.5" fill="#E9D5FF" />
  <circle cx="130" cy="140" r="2.5" fill="#E9D5FF" />

  <!-- Celestial Starlight Sparkles -->
  <circle cx="48" cy="48" r="2" fill="#FFFFFF" />
  <circle cx="152" cy="48" r="2" fill="#FFFFFF" />
  <circle cx="100" cy="16" r="2.5" fill="#F5E8D0" />
</svg>