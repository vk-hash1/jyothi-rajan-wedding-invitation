<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C27D56" />
      <stop offset="40%" stop-color="#9A5333" />
      <stop offset="100%" stop-color="#642E1B" />
    </linearGradient>
    <linearGradient id="matkorChampagne" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F5E8D0" />
      <stop offset="75%" stop-color="#C5A869" />
      <stop offset="100%" stop-color="#9B7ED9" />
    </linearGradient>
    <linearGradient id="diyaFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <radialGradient id="matkorAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5EEFD" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#DDD6FE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9B7ED9" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Aura Halo -->
  <circle cx="100" cy="100" r="90" fill="url(#matkorAura)" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#matkorChampagne)" stroke-width="1.5" stroke-dasharray="3,4" />

  <!-- Sacred Soil & Decorated Base Platform -->
  <ellipse cx="100" cy="162" rx="72" ry="18" fill="#E2D9F3" />
  <ellipse cx="100" cy="160" rx="66" ry="14" fill="none" stroke="url(#matkorChampagne)" stroke-width="1.5" stroke-dasharray="2,3" />

  <!-- Traditional Sacred Mitti Kalash (Earthen Vessel) -->
  <path d="M 82 108 C 65 125, 66 148, 80 156 C 88 160, 112 160, 120 156 C 134 148, 135 125, 118 108 Z" fill="url(#terracottaGrad)" />
  <ellipse cx="100" cy="108" rx="18" ry="6" fill="#D3906B" stroke="url(#matkorChampagne)" stroke-width="1.5" />

  <!-- Sacred White & Turmeric Chuna/Haldi Rings on Earthen Pot -->
  <path d="M 74 130 Q 100 137 126 130" stroke="#FFFBEB" stroke-width="2" fill="none" />
  <path d="M 72 137 Q 100 144 128 137" stroke="#FDE047" stroke-width="1.8" fill="none" />
  <path d="M 76 144 Q 100 150 124 144" stroke="#FFFBEB" stroke-width="1.5" fill="none" stroke-dasharray="3,2" />

  <!-- Auspicious Dots on Earthen Pot -->
  <circle cx="90" cy="122" r="2" fill="#FDE047" />
  <circle cx="100" cy="123" r="2.5" fill="#A855F7" />
  <circle cx="110" cy="122" r="2" fill="#FDE047" />

  <!-- Mango Leaf Sprigs Emerging from the Vessel -->
  <path d="M 85 106 C 70 94, 66 78, 62 70 C 74 76, 86 90, 89 105 Z" fill="#2E7D32" />
  <path d="M 115 106 C 130 94, 134 78, 138 70 C 126 76, 114 90, 111 105 Z" fill="#2E7D32" />
  <path d="M 93 102 C 86 85, 84 66, 83 56 C 93 68, 96 86, 97 102 Z" fill="#388E3C" />
  <path d="M 107 102 C 114 85, 116 66, 117 56 C 107 68, 104 86, 103 102 Z" fill="#388E3C" />
  <path d="M 100 98 C 98 80, 98 56, 100 46 C 102 56, 102 80, 100 98 Z" fill="#4CAF50" />

  <!-- Sacred Brass Diya with Flame on the Side (Auspicious Aarti) -->
  <path d="M 130 155 Q 142 165 158 155 Q 146 148 130 155 Z" fill="url(#matkorChampagne)" />
  <!-- Dancing Diya Flame -->
  <path d="M 132 152 C 127 142, 130 132, 134 125 C 137 132, 140 142, 135 152 Z" fill="url(#diyaFlame)" />
  <circle cx="134" cy="138" r="2" fill="#FFFFFF" />

  <!-- Celestial Starlight particles -->
  <circle cx="62" cy="58" r="1.8" fill="#F5E8D0" />
  <circle cx="148" cy="62" r="2" fill="#FFFFFF" />
  <circle cx="160" cy="100" r="1.5" fill="#DDD6FE" />
</svg>