    <path d="M 256 160 C 284 164, 304 188, 300 216 C 297 238, 278 250, 258 248" stroke-width="1.5" />
    <path d="M 262 175 C 278 178, 290 194, 288 210 C 286 224, 274 232, 260 230" stroke-width="1.2" stroke-dasharray="3,3" />
    <circle cx="305" cy="254" r="5" stroke-width="1.8" />
    <circle cx="305" cy="254" r="2" fill="url(#celestialSilverChampagne)" />
    <path d="M 305 259 L 305 268" stroke-width="2" />
    <circle cx="305" cy="270" r="3" fill="url(#celestialSilverChampagne)" />

    <!-- TUSK (Ekadanta) -->
    <path d="M 218 226 L 228 228 L 222 235 Z" fill="url(#celestialSilverChampagne)" stroke-width="1" />
    <path d="M 182 226 L 168 232 C 170 238, 178 238, 180 234 Z" fill="url(#celestialSilverChampagne)" stroke-width="1" />

    <!-- TRUNK (Sond) -->
    <path d="M 188 200 C 188 240, 215 260, 215 285 C 215 315, 175 328, 170 300 C 166 280, 182 270, 192 274 C 198 276, 200 286, 194 290 C 190 292, 185 290, 184 286" stroke-width="3" />
    <path d="M 212 200 C 212 230, 230 255, 230 285 C 230 330, 160 345, 155 300" stroke-width="2" />
    <path d="M 194 230 C 202 232, 210 232, 218 230" stroke-width="2" />
    <path d="M 197 245 C 205 248, 215 248, 223 245" stroke-width="1.8" />
    <path d="M 200 260 C 208 263, 218 263, 226 260" stroke-width="1.8" />
    <circle cx="188" cy="285" r="4.5" fill="url(#celestialSilverChampagne)" stroke="none" />
    
