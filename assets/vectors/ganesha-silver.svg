    <path d="M 130 295 C 132 280, 142 278, 148 290 C 152 298, 156 312, 145 324 C 138 332, 126 330, 122 318 C 120 310, 124 300, 130 295 Z" stroke-width="2.2" />
    <path d="M 132 285 L 133 270 C 134 266, 138 266, 139 270 L 140 285" stroke-width="2" />
    <path d="M 140 274 L 142 262 C 143 258, 147 258, 148 262 L 149 276" stroke-width="2" />
    <path d="M 149 276 L 151 266 C 152 262, 155 262, 156 266 L 156 280" stroke-width="2" />
    <path d="M 156 282 L 159 274 C 160 270, 163 270, 164 274 L 163 288" stroke-width="2" />
    <circle cx="140" cy="305" r="4.5" stroke-width="1.5" />
    <circle cx="140" cy="305" r="1.5" fill="url(#celestialSilverChampagne)" stroke="none" />

    <!-- MODAK PATRA (Bowl of Sweets) -->
    <path d="M 245 305 C 248 322, 270 322, 273 305 Z" stroke-width="2.2" />
    <ellipse cx="259" cy="305" rx="14" ry="4" stroke-width="1.5" />
    <circle cx="254" cy="300" r="3" fill="url(#celestialSilverChampagne)" stroke="none" />
    <circle cx="264" cy="300" r="3" fill="url(#celestialSilverChampagne)" stroke="none" />
    <circle cx="259" cy="294" r="3" fill="url(#celestialSilverChampagne)" stroke="none" />

    <!-- LOTUS BASE -->
    <path d="M 155 355 C 175 348, 225 348, 245 355" stroke-width="2" />
    <path d="M 175 356 C 185 370, 195 380, 200 380 C 205 380, 215 370, 225 356" stroke-width="2" />
    <path d="M 150 357 C 160 368, 170 376, 180 374" stroke-width="1.5" />
    <path d="M 250 357 C 240 368, 230 376, 220 374" stroke-width="1.5" />
    <circle cx="200" cy="372" r="2.5" fill="url(#celestialSilverChampagne)" stroke="none" />
  </g>
</svg>