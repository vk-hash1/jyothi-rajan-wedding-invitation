    <circle cx="95" cy="254" r="5" stroke-width="1.8" />
    <circle cx="95" cy="254" r="2" fill="url(#celestialSilverChampagne)" />
    <path d="M 95 259 L 95 268" stroke-width="2" />
    <circle cx="95" cy="270" r="3" fill="url(#celestialSilverChampagne)" />

