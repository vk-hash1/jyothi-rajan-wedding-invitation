    <path d="M 200 52 L 200 66" stroke-width="2.5" />
    <circle cx="200" cy="50" r="3.5" fill="url(#celestialSilverChampagne)" />
    <!-- Crown Tier 1 -->
    <path d="M 193 68 C 195 62, 205 62, 207 68 C 204 74, 196 74, 193 68 Z" fill="url(#celestialSilverChampagne)" stroke-width="1.2" />
    <!-- Crown Tier 2 & Arch -->
    <path d="M 182 82 C 188 72, 212 72, 218 82 C 210 88, 190 88, 182 82 Z" stroke-width="2" />
    <path d="M 172 102 C 182 86, 218 86, 228 102 C 215 110, 185 110, 172 102 Z" stroke-width="2.2" />
