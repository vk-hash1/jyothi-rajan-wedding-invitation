<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="100%" height="100%">
  <defs>
    <linearGradient id="celestialSilverChampagne" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#F5E8D0" />
      <stop offset="55%" stop-color="#E2E8F0" />
      <stop offset="85%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B8A9C9" />
    </linearGradient>
    <radialGradient id="lilacAura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#EDE7F6" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#C5B9E8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#9B7ED9" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ethereal Aura Halo -->
  <circle cx="200" cy="210" r="185" fill="url(#lilacAura)" />
  <g stroke="url(#celestialSilverChampagne)" fill="none" opacity="0.85">
    <circle cx="200" cy="210" r="175" stroke-width="1.5" stroke-dasharray="4,6" />
    <circle cx="200" cy="210" r="162" stroke-width="1.2" />
    <circle cx="200" cy="210" r="150" stroke-width="0.7" stroke-dasharray="2,4" />
    
    <!-- Outer Radiance Rays & Drops -->
    <g stroke-width="1.5">
      <path d="M 200 30 L 200 45" />
      <path d="M 200 375 L 200 390" />
      <path d="M 25 210 L 40 210" />
      <path d="M 360 210 L 375 210" />
      <path d="M 76 86 L 87 97" />
      <path d="M 313 97 L 324 86" />
      <path d="M 76 334 L 87 323" />
      <path d="M 313 323 L 324 334" />
    </g>

    <!-- Ray tips with moonlight pearls -->
    <g fill="url(#celestialSilverChampagne)" stroke="none">
      <circle cx="200" cy="25" r="3" />
      <circle cx="200" cy="395" r="3" />
      <circle cx="20" cy="210" r="3" />
      <circle cx="380" cy="210" r="3" />
      <circle cx="72" cy="82" r="2.5" />
      <circle cx="328" cy="82" r="2.5" />
      <circle cx="72" cy="338" r="2.5" />
      <circle cx="328" cy="338" r="2.5" />
    </g>
  </g>

