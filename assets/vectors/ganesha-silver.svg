    <path d="M 160 128 C 175 106, 225 106, 240 128 C 220 136, 180 136, 160 128 Z" stroke-width="2.5" />
    <path d="M 200 86 L 200 128" stroke-width="1.5" />
    <path d="M 188 95 L 188 126" stroke-width="1.2" />
    <path d="M 212 95 L 212 126" stroke-width="1.2" />
    <circle cx="200" cy="115" r="3" fill="url(#celestialSilverChampagne)" />
