<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="celestialSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#C5A869" />
      <stop offset="100%" stop-color="#9B7ED9" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EDE7F6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C5B9E8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0E1126" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="250" cy="250" r="230" fill="url(#centerGlow)" />

  <g stroke="url(#celestialSilverGrad)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Star Trail Ring -->
    <circle cx="250" cy="250" r="235" stroke-width="1.2" stroke-dasharray="3,6" opacity="0.6" />
    <circle cx="250" cy="250" r="220" stroke-width="2" />
    <circle cx="250" cy="250" r="205" stroke-width="1.2" stroke-dasharray="2,4" />

    <!-- 16 Radial Starburst Points -->
    <g stroke-width="1.5">
      <!-- 0 deg -->
      <path d="M 250 25 L 255 110 L 250 120 L 245 110 Z" fill="url(#celestialSilverGrad)" opacity="0.7" />
      <!-- 45 deg -->
      <path d="M 409 91 L 348 152 L 341 159 L 348 166 Z" fill="url(#celestialSilverGrad)" opacity="0.5" />
      <!-- 90 deg -->
      <path d="M 475 250 L 390 255 L 380 250 L 390 245 Z" fill="url(#celestialSilverGrad)" opacity="0.7" />
      <!-- 135 deg -->
      <path d="M 409 409 L 348 348 L 341 341 L 348 334 Z" fill="url(#celestialSilverGrad)" opacity="0.5" />
      <!-- 180 deg -->
      <path d="M 250 475 L 255 390 L 250 380 L 245 390 Z" fill="url(#celestialSilverGrad)" opacity="0.7" />
      <!-- 225 deg -->
      <path d="M 91 409 L 152 348 L 159 341 L 152 334 Z" fill="url(#celestialSilverGrad)" opacity="0.5" />
      <!-- 270 deg -->
      <path d="M 25 250 L 110 255 L 120 250 L 110 245 Z" fill="url(#celestialSilverGrad)" opacity="0.7" />
      <!-- 315 deg -->
      <path d="M 91 91 L 152 152 L 159 159 L 152 166 Z" fill="url(#celestialSilverGrad)" opacity="0.5" />
    </g>

    <!-- Mid Lotus Petals Ring (12 Petals) -->
    <circle cx="250" cy="250" r="160" stroke-width="1.8" />
    <circle cx="250" cy="250" r="140" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Inner Sacred Lotus (8 Petals) -->
    <path d="M 250 140 C 270 180, 270 200, 250 250 C 230 200, 230 180, 250 140 Z" stroke-width="1.8" fill="url(#celestialSilverGrad)" fill-opacity="0.1" />
    <path d="M 250 360 C 270 320, 270 300, 250 250 C 230 300, 230 320, 250 360 Z" stroke-width="1.8" fill="url(#celestialSilverGrad)" fill-opacity="0.1" />
    <path d="M 140 250 C 180 270, 200 270, 250 250 C 200 230, 180 230, 140 250 Z" stroke-width="1.8" fill="url(#celestialSilverGrad)" fill-opacity="0.1" />
    <path d="M 360 250 C 320 270, 300 270, 250 250 C 300 230, 320 230, 360 250 Z" stroke-width="1.8" fill="url(#celestialSilverGrad)" fill-opacity="0.1" />

    <path d="M 172 172 C 215 195, 225 210, 250 250 C 210 225, 195 215, 172 172 Z" stroke-width="1.8" fill="url(#celestialSilverGrad)" fill-opacity="0.1" />
    <path d="M 328 172 C 285 195, 275 210, 250 250 C 290 225, 305 215, 328 172 Z" stroke-width="1.8" fill="url(#celestialSilverGrad)" fill-opacity="0.1" />
    <path d="M 172 328 C 215 305, 225 290, 250 250 C 210 275, 195 285, 172 328 Z" stroke-width="1.8" fill="url(#celestialSilverGrad)" fill-opacity="0.1" />
    <path d="M 328 328 C 285 305, 275 290, 250 250 C 290 275, 305 285, 328 328 Z" stroke-width="1.8" fill="url(#celestialSilverGrad)" fill-opacity="0.1" />

    <!-- Center Celestial Bindu / Star -->
    <circle cx="250" cy="250" r="50" stroke-width="2" />
    <circle cx="250" cy="250" r="42" stroke-width="1.2" stroke-dasharray="2,3" />
    <circle cx="250" cy="250" r="14" fill="url(#celestialSilverGrad)" />
    <circle cx="250" cy="250" r="6" fill="#FFFFFF" />
  </g>
</svg>