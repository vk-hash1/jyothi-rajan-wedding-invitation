<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="tilakChampagne" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F5E8D0" />
      <stop offset="75%" stop-color="#C5A869" />
      <stop offset="100%" stop-color="#9B7ED9" />
    </linearGradient>
    <linearGradient id="kumkumLilac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="coconutSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B7355" />
      <stop offset="100%" stop-color="#4A3728" />
    </linearGradient>
    <radialGradient id="tilakAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EDE7F6" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#D8B4FE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9B7ED9" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Aura Halo -->
  <circle cx="100" cy="100" r="90" fill="url(#tilakAura)" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#tilakChampagne)" stroke-width="1.5" stroke-dasharray="3,4" />

  <!-- Sacred Thali Base in Champagne & Silver -->
  <ellipse cx="100" cy="160" rx="75" ry="20" fill="url(#tilakChampagne)" />
  <ellipse cx="100" cy="158" rx="70" ry="17" fill="#F8FAFC" />
  <ellipse cx="100" cy="158" rx="68" ry="15" fill="none" stroke="url(#kumkumLilac)" stroke-width="1.5" stroke-dasharray="2,3" />

  <!-- Sacred Kalash (Brass Pot) -->
  <path d="M 85 105 L 75 130 C 70 148, 130 148, 125 130 L 115 105 Z" fill="url(#tilakChampagne)" />
  <ellipse cx="100" cy="105" rx="16" ry="6" fill="#FFFDF5" stroke="url(#tilakChampagne)" stroke-width="1.5" />
  
  <!-- Sacred Swastik on Kalash Body in Royal Lilac -->
  <g stroke="url(#kumkumLilac)" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="100" y1="120" x2="100" y2="136" />
    <line x1="92" y1="128" x2="108" y2="128" />
    <line x1="100" y1="120" x2="106" y2="120" />
    <line x1="100" y1="136" x2="94" y2="136" />
    <line x1="92" y1="128" x2="92" y2="122" />
    <line x1="108" y1="128" x2="108" y2="134" />
  </g>

  <!-- Mango Leaves (Amra Pallav) radiating from Kalash rim -->
  <path d="M 88 102 C 72 90, 68 76, 64 68 C 76 74, 88 88, 92 102 Z" fill="#2E7D32" />
  <path d="M 112 102 C 128 90, 132 76, 136 68 C 124 74, 112 88, 108 102 Z" fill="#2E7D32" />
  <path d="M 94 98 C 88 82, 86 64, 85 54 C 95 65, 98 82, 98 98 Z" fill="#388E3C" />
  <path d="M 106 98 C 112 82, 114 64, 115 54 C 105 65, 102 82, 102 98 Z" fill="#388E3C" />
  <path d="M 100 95 C 98 78, 98 55, 100 45 C 102 55, 102 78, 100 95 Z" fill="#4CAF50" />

  <!-- Sacred Coconut (Shriphal) on Top with Mauli Thread -->
  <ellipse cx="100" cy="74" rx="14" ry="18" fill="url(#coconutSilver)" />
  <path d="M 87 72 Q 100 75 113 72" stroke="#E9D5FF" stroke-width="2" fill="none" />
  <path d="M 88 77 Q 100 80 112 77" stroke="#F5E8D0" stroke-width="1.5" fill="none" />

  <!-- Auspicious Chandan & Tilak Bowl on the Thali -->
  <circle cx="65" cy="156" r="10" fill="url(#tilakChampagne)" />
  <circle cx="65" cy="156" r="7" fill="#FDE047" />
  <circle cx="65" cy="156" r="3" fill="#A855F7" />

  <!-- Glowing Starlight accents -->
  <circle cx="140" cy="55" r="2" fill="#FFFFFF" />
  <circle cx="60" cy="65" r="1.5" fill="#F5E8D0" />
</svg>